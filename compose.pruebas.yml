name: helpdesk-verificacion

x-entorno: &entorno
  CLAMAV_ENABLED: "false"
  APP_ENV: test
  SECRET_KEY: solo-pruebas-aisladas-no-utilizar-en-produccion-1234567890
  MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
  REDIS_URL: redis://redis:6379/0
  RATE_LIMIT_PER_MINUTE: "3000"
  COOKIE_SECURE: "false"

services:
  mongo:
    image: mesa-ayuda-mongo
    build: {context: ./deploy, dockerfile: Dockerfile.mongo, network: "${BUILD_NETWORK:-default}"}
    command: [mongod, --replSet, rs0, --noscripting, --bind_ip_all, --wiredTigerCacheSizeGB, "0.5"]
    volumes: [mongo-pruebas:/data/db, config-mongo-pruebas:/data/configdb]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand({ping:1}).ok"]
      interval: 2s
      timeout: 5s
      retries: 30
  mongo-init:
    image: mesa-ayuda-mongo
    build: {context: ./deploy, dockerfile: Dockerfile.mongo, network: "${BUILD_NETWORK:-default}"}
    depends_on:
      mongo: {condition: service_healthy}
    entrypoint: [sh, -c]
    command:
      - >-
        mongosh --host mongo --quiet --eval 'try { rs.status() } catch(e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }';
        for i in $$(seq 1 60); do
          if mongosh --host mongo --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi;
          sleep 1;
        done; exit 1
  redis:
    image: redis:7-alpine
    tmpfs: [/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build: {context: ./backend, target: develop, network: "${BUILD_NETWORK:-default}"}
    image: helpdesk-pruebas-api
    profiles: [suite]
    depends_on:
      mongo-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    environment:
      <<: *entorno
      MONGO_DB: helpdesk_test_suite
      TEST_MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      TEST_CHATBOT_MONGO: mongodb://mongo:27017/?replicaSet=rs0
      TEST_REDIS_URL: redis://redis:6379/1
    tmpfs: ["/data:uid=10001,gid=10001"]
    volumes: [./backend:/app:ro]
    command: [python, -m, pytest, -ra, --tb=short, --show-capture=no, -p, "no:cacheprovider"]
  api: &api-pruebas
    build: {context: ./backend, target: develop, network: "${BUILD_NETWORK:-default}"}
    image: helpdesk-pruebas-api
    profiles: [navegador]
    depends_on:
      mongo-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    environment:
      <<: *entorno
      MONGO_DB: helpdesk_test_navegador
      REDIS_URL: redis://redis:6379/2
    ports: ["127.0.0.1:18100:8000"]
    volumes: [./backend:/app:ro, datos-api:/data]
    command: [sh, -c, "python -m app.scripts.preparar_pruebas && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
  api-restauracion:
    <<: *api-pruebas
    profiles: [restauracion]
    environment:
      <<: *entorno
      MONGO_DB: helpdesk_test_restauracion
      REDIS_URL: redis://redis:6379/3
    ports: ["127.0.0.1:18101:8000"]
    volumes: [./backend:/app:ro, datos-restauracion:/data]
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000"]
  api-seguridad:
    <<: *api-pruebas
    profiles: [seguridad]
    environment:
      <<: *entorno
      APP_ENV: production
      MONGO_DB: helpdesk_test_navegador
      REDIS_URL: redis://redis:6379/6
      COOKIE_SECURE: "true"
      CORS_ORIGINS: "https://localhost:18111"
    ports: ["127.0.0.1:18102:8000"]
    volumes: [./backend:/app:ro, datos-api:/data]
    command: [sh, -c, "exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips \"$${FORWARDED_ALLOW_IPS:-$(python -m app.scripts.redes_proxy)}\" --ws-max-size 8192 --ws-max-queue 8"]
  web-seguridad:
    image: mesa-ayuda-web
    profiles: [seguridad]
    depends_on:
      api-seguridad: {condition: service_healthy}
  proxy-seguridad:
    image: mesa-ayuda-proxy
    profiles: [seguridad]
    depends_on: [web-seguridad]
    environment:
      SITE_ADDRESS: localhost
      API_UPSTREAM: api-seguridad:8000
      WEB_UPSTREAM: web-seguridad:80
    ports: ["127.0.0.1:18110:80", "127.0.0.1:18111:443"]
    volumes: [./deploy/Caddyfile:/etc/caddy/Caddyfile:ro]
    tmpfs: [/data, /config]
    healthcheck:
      test: [CMD, test, -f, /data/caddy/pki/authorities/local/root.crt]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  mongo-pruebas:
  config-mongo-pruebas:
  datos-api:
  datos-restauracion:
