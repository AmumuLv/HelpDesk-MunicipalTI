# Servidor de la interfaz.
# La API la sirve el proxy (Caddy) o el propio Nginx: aquí solo archivos.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Permite fotos de 2 MB y adjuntos de hasta 15 MB, incluido el cuerpo multipart.
    client_max_body_size 20m;

    # Docker puede cambiar la IP de la API al recrear su contenedor.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    set $api_backend api:8000;

    # Comprobar que el contenedor está vivo
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # La API y el WebSocket: mismo origen, sin CORS
    location /api/ws/ {
        # El token de acceso del socket no debe quedar en el registro de peticiones.
        access_log off;
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El chat en vivo del ticket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Archivos con huella en el nombre: se cachean para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Tipografías locales (Atkinson Hyperlegible)
    location /fuentes/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea: así el despliegue se ve al recargar
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Cualquier otra ruta devuelve la aplicación (enrutado del navegador)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
}

# Required para mapear la cabecera Connection en la conexión WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
