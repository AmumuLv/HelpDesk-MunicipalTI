name: Verificar proyecto
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Suite del servidor en servicios aislados
        run: docker compose -f compose.pruebas.yml run --build --rm tests
      - name: Diagnóstico de servicios si falla la suite
        if: failure()
        run: |
          docker compose -f compose.pruebas.yml ps -a
          docker compose -f compose.pruebas.yml logs --no-color --tail 150 mongo mongo-init redis
      - name: Retirar servicios de pruebas
        if: always()
        run: docker compose -f compose.pruebas.yml down -v
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run verify:ai-texts
      - run: npm run verify:clases
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test pruebas/portal-sencillo.spec.ts --reporter=list
  publicacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/revisar_publicacion.py
      - run: python tools/verificar_rutas.py
      - run: python -m unittest discover -s tools -p 'test_*.py'
