name: Verificar proyecto
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    # MongoDB 8.0 requiere un kernel anterior a 6.19 (SERVER-121912).
    runs-on: ubuntu-22.04
    # The image now compiles and checks its native security backports as well.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Suite del servidor en servicios aislados
        run: docker compose -f compose.pruebas.yml run --build --rm tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Preparar navegador para los cruces entre roles
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Iniciar la instalación ficticia del navegador
        run: docker compose -f compose.pruebas.yml --profile navegador up -d --wait --wait-timeout 120 api
      - name: Flujos combinados, aplicación de IA y relevo desde Excel
        working-directory: frontend
        env:
          PRUEBA_API_URL: http://127.0.0.1:18100
          PRUEBA_NAVEGADORES: chromium
        run: npx playwright test pruebas/flujos-combinados-roles.spec.ts pruebas/ia-aplicar-sugerencia.spec.ts pruebas/importacion-relevo.spec.ts pruebas/ticket-conjunto.spec.ts pruebas/ticket-laptop.spec.ts pruebas/analisis-ampliado-real.spec.ts --reporter=list
      - name: Diagnóstico de servicios si falla la suite
        if: failure()
        run: |
          docker compose -f compose.pruebas.yml ps -a
          docker compose -f compose.pruebas.yml logs --no-color --tail 150 mongo mongo-init redis api
      - name: Retirar servicios de pruebas
        if: always()
        run: docker compose -f compose.pruebas.yml --profile '*' down -v --remove-orphans
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run verify:ai-texts
      - run: npm run verify:clases
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test pruebas/portal-sencillo.spec.ts pruebas/analisis-ampliado.spec.ts pruebas/consultas-chat.spec.ts pruebas/chats-casos-adicionales.spec.ts pruebas/chats-fluidez.spec.ts --reporter=list
  publicacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/revisar_publicacion.py
      - run: python tools/verificar_rutas.py
      - run: python tools/verificar_manuales.py
      - run: python -m unittest discover -s tools -p 'test_*.py'
